on:
  pull_request:
    paths-ignore:
    - "**/README.md"
  push:
    branches:
    - main
    paths-ignore:
    - "**/README.md"
jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15-intel, macos-14]
        java: ['11']
        distribution: [corretto]
        include:
        # JDK 11 has no Windows/AArch64 build, the port landed in JDK 16.
        - os: windows-11-arm
          java: '17'
          distribution: microsoft
    env:
      ORG_GRADLE_PROJECT_ossrhUsername: na
      ORG_GRADLE_PROJECT_ossrhPassword: na
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: ${{ matrix.distribution }}
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4.2.1
    - name: Test with Gradle
      run: ./gradlew test --stacktrace
