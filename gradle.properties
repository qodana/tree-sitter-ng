toolsDir=tools
miniSigDir=minisign
zigDir=zig
zigVersion=0.11.0
miniSignVersion=0.11
zigPubKey=RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
treeSitterTargets=x86_64-windows,x86_64-macos,x86_64-linux-gnu,aarch64-linux-gnu,aarch64-macos
org.gradle.parallel=true
org.gradle.workers.max=4
# Targets for the static archives, which is not the same list as treeSitterTargets.
# Windows is absent because zig defaults to the mingw-w64 ABI and native-image links
# through MSVC; it is built by BuildNativeStaticMsvcTask on a Windows runner instead.
# The glibc version is pinned because a static archive's references become the references
# of the binary that links it, and chatter enforces a 2.34 floor.
treeSitterStaticTargets=x86_64-macos,aarch64-macos,x86_64-linux-gnu.2.34,aarch64-linux-gnu.2.34
treeSitterStaticMsvcTarget=x86_64-windows
